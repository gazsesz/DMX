name: Build Play bundle

# Builds the Google Play app bundle (.aab, package smart.dmx.app), signed with
# the upload key from the repository secrets. Run it by hand (Actions tab →
# "Build Play bundle" → Run workflow) when a version is ready for the Play Console.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DMX_UPLOAD_KEYSTORE_BASE64  the upload keystore (.jks), base64-encoded
#   DMX_UPLOAD_STORE_PASSWORD   keystore password
#   DMX_UPLOAD_KEY_ALIAS        key alias (e.g. upload)
#   DMX_UPLOAD_KEY_PASSWORD     key password
#
# Without the secrets the job still builds, but with a throwaway key, and the
# artifact is named "...-TEST-NOT-FOR-PLAY": it proves the build works, the
# Play Console will reject it.

on:
  workflow_dispatch: {}
  # Also check the Play build whenever a PR touches the Android build setup.
  pull_request:
    paths:
      - 'app/android/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/build-play-bundle.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      DMX_PLAY_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Upload key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.DMX_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DMX_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DMX_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DMX_UPLOAD_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
            echo "DMX_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DMX_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DMX_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "artifact=dmx-controller-play-aab" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No upload key secrets: building with a throwaway key. This bundle cannot be uploaded to Google Play."
            pw="$(openssl rand -hex 16)"
            echo "::add-mask::$pw"
            keytool -genkeypair -keystore "$keystore" -storepass "$pw" -keypass "$pw" \
              -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" -noprompt
            echo "DMX_UPLOAD_STORE_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "DMX_UPLOAD_KEY_ALIAS=throwaway" >> "$GITHUB_ENV"
            echo "DMX_UPLOAD_KEY_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "artifact=dmx-controller-play-aab-TEST-NOT-FOR-PLAY" >> "$GITHUB_OUTPUT"
          fi
          echo "DMX_UPLOAD_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - run: flutter pub get

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.artifact }}
          path: app/build/app/outputs/bundle/release/app-release.aab
