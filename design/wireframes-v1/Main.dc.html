<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  a { color: #f5a623; } a:hover { color: #ffbf4d; }
  .phone{
    --bg:#0b0d10; --panel:#15181d; --panel-2:#1c2027; --border:#262b33;
    --text:#eef1f5; --text-dim:#9098a8; --text-faint:#5b6270;
    --accent:#f5a623; --accent-2:#22d3ee; --danger:#ef4444; --success:#22c55e;
    width:390px; height:1010px; background:var(--bg); position:relative;
    display:flex; flex-direction:column; overflow:hidden;
    font-family:'Manrope',system-ui,sans-serif; color:var(--text);
  }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .header{ display:flex; align-items:center; justify-content:space-between; padding:22px 18px 14px; border-bottom:1px solid var(--border); }
  .header h1{ font-size:21px; font-weight:800; margin:0; letter-spacing:.2px; }
  .status-chip{ display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--border); border-radius:999px; padding:6px 10px; font-size:10.5px; color:var(--text-dim); white-space:nowrap; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--success); flex:none; }
  .content{ flex:1; padding:18px 16px 20px; display:flex; flex-direction:column; gap:22px; overflow:hidden; }
  .section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; }
  .icon-btn{ width:28px; height:28px; border-radius:7px; background:var(--panel-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .trigger-grid{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:10px; }
  .trigger{ background:var(--panel); border:1.5px solid var(--border); border-radius:10px; padding:10px 8px; display:flex; flex-direction:column; gap:6px; min-height:66px; justify-content:center; }
  .trigger .kind{ font-size:8.5px; font-weight:800; letter-spacing:.06em; }
  .trigger .label{ font-size:12.5px; font-weight:700; line-height:1.15; }
  .trigger .sub{ font-size:10px; color:var(--text-faint); }
  .btn{ display:flex; align-items:center; justify-content:center; gap:6px; height:46px; border-radius:9px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-family:inherit; font-weight:700; font-size:13px; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#20130a; }
  .round-btn{ width:34px; height:34px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex:none; color:var(--text); }
  .row{ display:flex; align-items:center; gap:12px; }
  .slider{ flex:1; height:6px; border-radius:999px; background:var(--panel-2); position:relative; }
  .slider .fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--accent); }
  .slider .thumb{ position:absolute; top:50%; width:16px; height:16px; border-radius:50%; background:var(--accent); border:2.5px solid var(--panel); transform:translate(-50%,-50%); }
  .tap-btn{ width:64px; height:64px; border-radius:12px; background:var(--panel-2); border:1.5px solid var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex:none; }
  .tap-btn span{ font-size:9px; font-weight:800; color:var(--accent); letter-spacing:.06em; }
  .toggle{ width:40px; height:22px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border); position:relative; flex:none; }
  .toggle.on{ background:var(--accent); border-color:var(--accent); }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#0b0d10; }
  .toggle.on .knob{ left:20px; background:#20130a; }
  .fab{ position:absolute; right:16px; bottom:86px; width:58px; height:58px; border-radius:50%; background:var(--danger); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(239,68,68,.4); border:none; z-index:5; }
  .nav{ display:flex; border-top:1px solid var(--border); background:var(--panel); }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 2px 12px; color:var(--text-faint); }
  .nav-item.active{ color:var(--accent); }
  .nav-item span{ font-size:8.5px; font-weight:700; }
</style>
</helmet>

<div class="phone">
  <div class="header">
    <h1>Dashboard</h1>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="status-chip"><span class="dot"></span>EasyNode Blue &middot; 3U</div>
      <div class="icon-btn" title="Manual Control"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="7" cy="18" r="2" fill="var(--bg)"/></svg></div>
    </div>
  </div>

  <div class="content">
    <div>
      <div class="section-title">
        Quick Triggers
        <div class="icon-btn" title="Customize">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>
        </div>
      </div>
      <div class="trigger-grid">
        <sc-for list="{{triggers}}" as="item" hint-placeholder-count="12">
          <div class="trigger" style="border-color: {{item.borderColor}}; box-shadow: {{item.glow}};">
            <div class="kind" style="color: {{item.color}};">{{item.kind}}</div>
            <div class="label">{{item.label}}</div>
            <div class="sub">{{item.sub}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div>
      <div class="section-title">Tempo &amp; Chase Speed</div>
      <div class="card" style="display:flex; flex-direction:column; gap:16px;">
        <div class="row">
          <div class="tap-btn">
            <span>TAP</span>
            <div class="mono" style="font-size:13px; font-weight:700;">128</div>
          </div>
          <div style="flex:1;">
            <div style="font-size:11px; color:var(--text-faint); margin-bottom:6px;">Step Speed</div>
            <div class="row">
              <div class="round-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
              </div>
              <div class="slider"><div class="fill" style="width:38%;"></div><div class="thumb" style="left:38%;"></div></div>
              <div class="round-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </div>
            </div>
            <div class="mono" style="font-size:11px; color:var(--text-dim); margin-top:6px; text-align:right;">1.20s / step</div>
          </div>
        </div>

        <div style="border-top:1px solid var(--border);"></div>

        <div>
          <div class="row" style="justify-content:space-between;">
            <div class="row" style="gap:8px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M9 21h6"/></svg>
              <span style="font-size:13px; font-weight:600;">Beat Sync (Mic)</span>
            </div>
            <div class="toggle on"><div class="knob"></div></div>
          </div>
          <div style="margin-top:12px;">
            <div style="font-size:11px; color:var(--text-faint); margin-bottom:6px;">Sensitivity</div>
            <div class="slider"><div class="fill" style="width:62%; background:var(--accent-2);"></div><div class="thumb" style="left:62%; background:var(--accent-2);"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="fab" title="Blackout">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
  </div>

  <div class="nav">
    <div class="nav-item"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span>FILES</span></div>
    <div class="nav-item active"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>HOME</span></div>
    <div class="nav-item"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.1 5.9l-1.7 1.7M7.6 16.4l-1.7 1.7M18.1 18.1l-1.7-1.7M7.6 7.6 5.9 5.9"/></svg><span>SETUP</span></div>
    <div class="nav-item"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l3 6-6 3-6-3 3-6z"/><path d="M9 12v6a3 3 0 0 0 6 0v-6"/></svg><span>FIXTURE</span></div>
    <div class="nav-item"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>SCENE</span></div>
    <div class="nav-item"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg><span>BANK</span></div>
    <div class="nav-item"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v14l8-7-8-7z"/><path d="M13 5v14l8-7-8-7z"/></svg><span>CHASE</span></div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#f5a623","options":["#f5a623","#22d3ee","#a855f7","#ef4444"]}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      {label:'Bank 1', sub:'Scene 3', kind:'BANK', color:'#22d3ee', active:false},
      {label:'Bank 2', sub:'Scene 1', kind:'BANK', color:'#22d3ee', active:false},
      {label:'Sweep', sub:'Chase', kind:'CHASE', color:this.props.accent ?? '#f5a623', active:true},
      {label:'Bank 3', sub:'Scene 5', kind:'BANK', color:'#22d3ee', active:false},
      {label:'Rainbow', sub:'Chase', kind:'CHASE', color:this.props.accent ?? '#f5a623', active:false},
      {label:'Bank 4', sub:'Scene 2', kind:'BANK', color:'#22d3ee', active:false},
      {label:'Strobe FX', sub:'Chase', kind:'CHASE', color:this.props.accent ?? '#f5a623', active:false},
      {label:'Bank 5', sub:'Scene 4', kind:'BANK', color:'#22d3ee', active:false},
      {label:'Slow Fade', sub:'Chase', kind:'CHASE', color:this.props.accent ?? '#f5a623', active:false},
      {label:'Bank 6', sub:'Scene 1', kind:'BANK', color:'#22d3ee', active:false},
      {label:'Color Wave', sub:'Chase', kind:'CHASE', color:this.props.accent ?? '#f5a623', active:false},
      {label:'+ Add', sub:'Custom', kind:'', color:'#5b6270', active:false},
    ];
    const triggers = raw.map(t => ({
      ...t,
      borderColor: t.active ? (this.props.accent ?? '#f5a623') : '#262b33',
      glow: t.active ? '0 0 0 1px ' + (this.props.accent ?? '#f5a623') + ', 0 0 16px rgba(245,166,35,.35)' : 'none',
    }));
    return { triggers };
  }
}
</script>
</body>
</html>
