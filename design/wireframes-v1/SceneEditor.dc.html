<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  a { color: #f5a623; } a:hover { color: #ffbf4d; }
  .phone{
    --bg:#0b0d10; --panel:#15181d; --panel-2:#1c2027; --border:#262b33;
    --text:#eef1f5; --text-dim:#9098a8; --text-faint:#5b6270;
    --accent:#f5a623; --accent-2:#22d3ee; --danger:#ef4444; --success:#22c55e;
    width:390px; height:1520px; background:var(--bg); position:relative;
    display:flex; flex-direction:column; overflow:hidden;
    font-family:'Manrope',system-ui,sans-serif; color:var(--text);
  }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .header{ display:flex; align-items:center; gap:12px; padding:22px 18px 14px; border-bottom:1px solid var(--border); }
  .icon-btn{ width:34px; height:34px; border-radius:9px; background:var(--panel-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex:none; }
  .icon-btn.save{ background:var(--accent); border-color:var(--accent); color:#20130a; }
  .name-input{ flex:1; height:34px; border-radius:8px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:0 10px; font-weight:700; font-size:14px; }
  .content{ flex:1; padding:16px 16px 20px; display:flex; flex-direction:column; gap:18px; overflow:hidden; }
  .fixture-tabs{ display:flex; gap:8px; overflow-x:auto; }
  .f-chip{ display:inline-flex; align-items:center; gap:5px; padding:8px 14px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border); font-size:12px; font-weight:700; color:var(--text-dim); white-space:nowrap; flex:none; }
  .f-chip.active{ background:var(--accent); border-color:var(--accent); color:#20130a; }
  .select-summary{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-faint); margin-top:-8px; }
  .section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:0 0 10px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .color-preview-row{ display:flex; align-items:center; gap:14px; }
  .color-preview{ width:52px; height:52px; border-radius:12px; border:2px solid var(--border); flex:none; background:#f5a623; }
  .swatch-grid{ display:grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap:8px; flex:1; }
  .swatch{ aspect-ratio:1; border-radius:8px; border:2px solid transparent; }
  .swatch.selected{ border-color:#fff; }
  .wheel{ width:100%; height:120px; border-radius:12px; margin-top:12px; background: conic-gradient(red,yellow,lime,cyan,blue,magenta,red); position:relative; }
  .wheel::after{ content:''; position:absolute; inset:30%; border-radius:50%; background:radial-gradient(circle, #fff, rgba(255,255,255,0)); }
  .knob-marker{ position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid #111; top:22px; left:70%; transform:translate(-50%,-50%); }
  .ch-list{ display:flex; flex-direction:column; gap:14px; }
  .ch-item{ display:flex; align-items:center; gap:12px; }
  .ch-label{ width:56px; font-size:12px; font-weight:700; color:var(--text-dim); flex:none; }
  .slider{ flex:1; height:6px; border-radius:999px; background:var(--panel-2); position:relative; }
  .slider .fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--accent); }
  .slider .thumb{ position:absolute; top:50%; width:16px; height:16px; border-radius:50%; background:var(--accent); border:2.5px solid var(--panel); transform:translate(-50%,-50%); }
  .val-box{ width:46px; height:30px; border-radius:7px; background:var(--panel-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; flex:none; }
  .knob-row{ display:flex; gap:24px; justify-content:center; padding:6px 0 2px; }
  .knob-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .knob{ width:56px; height:56px; border-radius:50%; background:var(--panel-2); border:2px solid var(--border); position:relative; }
  .knob .indicator{ position:absolute; width:3px; height:20px; background:var(--accent); top:6px; left:50%; transform-origin:bottom center; transform:translateX(-50%) rotate(35deg); border-radius:2px; }
  .knob-label{ font-size:10.5px; color:var(--text-faint); font-weight:700; }
  .btn-row{ display:flex; gap:10px; }
  .btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; height:46px; border-radius:9px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-family:inherit; font-weight:700; font-size:13px; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#20130a; }
  .gobo-grid{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:10px; }
  .gobo-swatch{ aspect-ratio:1; border-radius:10px; border:2px solid var(--border); background-color:var(--panel-2); }
  .gobo-swatch.selected{ border-color:var(--accent-2); }
  .toggle{ width:40px; height:22px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border); position:relative; flex:none; }
  .toggle.on{ background:var(--accent-2); border-color:var(--accent-2); }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#0b0d10; }
  .toggle.on .knob{ left:20px; background:#06222a; }
</style>
</helmet>

<div class="phone">
  <div class="header">
    <div class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <input class="name-input" value="Rainbow Sweep" />
    <div class="icon-btn save"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-9"/></svg></div>
  </div>

  <div class="content">
    <div class="fixture-tabs">
      <div class="f-chip">ALL</div>
      <div class="f-chip">PAR 1</div>
      <div class="f-chip">PAR 2</div>
      <div class="f-chip active"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-9"/></svg>Moving Head 1</div>
      <div class="f-chip active"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-9"/></svg>Moving Head 2</div>
    </div>
    <div class="select-summary">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      2 fixtures selected &ndash; edits below apply to both
    </div>

    <div>
      <div class="section-title">Color</div>
      <div class="card">
        <div class="color-preview-row">
          <div class="color-preview"></div>
          <div class="swatch-grid">
            <sc-for list="{{presets}}" as="p" hint-placeholder-count="16">
              <div class="swatch" style="background: {{p}};"></div>
            </sc-for>
          </div>
        </div>
        <div class="wheel"><div class="knob-marker"></div></div>
      </div>
    </div>

    <div>
      <div class="section-title">Pan / Tilt</div>
      <div class="card">
        <div class="knob-row">
          <div class="knob-wrap">
            <div class="knob"><div class="indicator"></div></div>
            <div class="knob-label mono">PAN 128</div>
          </div>
          <div class="knob-wrap">
            <div class="knob"><div class="indicator" style="transform:translateX(-50%) rotate(-20deg);"></div></div>
            <div class="knob-label mono">TILT 64</div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Gobo</div>
      <div class="card">
        <div class="gobo-grid">
          <sc-for list="{{gobos}}" as="g" hint-placeholder-count="8">
            <div class="gobo-swatch {{g.cls}}" style="background-image: {{g.pattern}};"></div>
          </sc-for>
        </div>
        <div style="margin-top:14px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span style="font-size:11px; color:var(--text-faint);">Gobo Rotation</span>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:10.5px; color:var(--text-dim);">Continuous</span>
              <div class="toggle"><div class="knob"></div></div>
            </div>
          </div>
          <div class="slider"><div class="fill" style="width:30%; background:var(--accent-2);"></div><div class="thumb" style="left:30%; background:var(--accent-2);"></div></div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Channels</div>
      <div class="card">
        <div class="ch-list">
          <sc-for list="{{channels}}" as="c" hint-placeholder-count="5">
            <div class="ch-item">
              <div class="ch-label">{{c.name}}</div>
              <div class="slider"><div class="fill" style="width: {{c.pct}}%; background: {{c.color}};"></div><div class="thumb" style="left: {{c.pct}}%; background: {{c.color}};"></div></div>
              <div class="val-box mono">{{c.val}}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <div class="btn">Assign to Bank</div>
      <div class="btn btn-primary">Save Scene</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const presets = ['#ef4444','#f97316','#f5a623','#facc15','#a3e635','#22c55e','#22d3ee','#0ea5e9','#3b82f6','#6366f1','#a855f7','#d946ef','#ec4899','#ffffff','#f8fafc','#111827'];
    const goboPatterns = [
      { name: 'Open', pattern: 'none' },
      { name: 'Dots', pattern: 'radial-gradient(#fff 22%, transparent 23%)' },
      { name: 'Breakup', pattern: 'repeating-conic-gradient(#fff 0 10deg, transparent 10deg 24deg)' },
      { name: 'Stars', pattern: 'radial-gradient(#fff 12%, transparent 13%), radial-gradient(#fff 12%, transparent 13%)' },
      { name: 'Stripes', pattern: 'repeating-linear-gradient(45deg, #fff 0 3px, transparent 3px 9px)' },
      { name: 'Swirl', pattern: 'conic-gradient(from 0deg, #fff, transparent 65%)' },
      { name: 'Triangle', pattern: 'linear-gradient(135deg, #fff 50%, transparent 50%)' },
      { name: 'Prism', pattern: 'conic-gradient(#ef4444,#f5a623,#facc15,#22c55e,#22d3ee,#6366f1,#ef4444)' },
    ];
    const selectedGobo = 5;
    const gobos = goboPatterns.map((g, i) => ({
      pattern: g.pattern,
      cls: i === selectedGobo ? 'selected' : '',
    }));
    const channels = [
      {name:'Dimmer', val:255, pct:100, color:'#f5a623'},
      {name:'Red', val:255, pct:100, color:'#ef4444'},
      {name:'Green', val:40, pct:16, color:'#22c55e'},
      {name:'Blue', val:180, pct:70, color:'#3b82f6'},
      {name:'Strobe', val:0, pct:0, color:'#9098a8'},
    ];
    return { presets, gobos, channels };
  }
}
</script>
</body>
</html>
